name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipment
          POSTGRES_PASSWORD: shipment
          POSTGRES_DB: shipment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipment -d shipment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shipment:shipment@localhost:5432/shipment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]" -e "apps/worker[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy apps

      - name: Unit and API tests
        run: python -m pytest

  integration-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build api worker

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run pipeline smoke
        run: python3 scripts/smoke_compose.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

[project]
name = "shipforge"
version = "0.1.0"
description = "Local software shipment platform (root tooling config)"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "apps/worker"]
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api:apps/worker"
namespace_packages = true
explicit_package_bases = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "worker_app.tasks.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# All suites live under apps/api/tests: api and worker share one venv and one
# `tests` package (worker tests import worker_app via pythonpath).
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api", "apps/worker"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

# Source: shipment-platform/templates/minio.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shipment-platform-shipment-platform-minio
  labels:
    app.kubernetes.io/name: shipment-platform
    app.kubernetes.io/instance: shipment-platform
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shipment-platform-0.1.0
    app.kubernetes.io/component: minio
spec:
  serviceName: shipment-platform-shipment-platform-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipment-platform
      app.kubernetes.io/instance: shipment-platform
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipment-platform
        app.kubernetes.io/instance: shipment-platform
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        # fsGroup makes kubelet chown the volume — no root init container
        # needed (and pod security forbids running as root anyway).
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: minio
          image: bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-shipment-platform-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-shipment-platform-secrets
                  key: MINIO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shipment-platform-shipment-platform-minio-data

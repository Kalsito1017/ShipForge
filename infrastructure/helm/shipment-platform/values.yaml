# Default values (production-like). Override per environment with
# values-dev.yaml / values-local.yaml.

nameOverride: ""
fullnameOverride: ""

image:
  api:
    repository: shipforge-api
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: shipforge-worker
    tag: latest
    pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

worker:
  replicas: 1
  concurrency: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  terminationGracePeriodSeconds: 60
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

config:
  appEnv: development
  logLevel: INFO
  jwtAlgorithm: HS256
  jwtExpiresMinutes: 60
  llmBaseUrl: https://api.openai.com/v1
  llmModel: gpt-4o-mini
  llmTimeoutSeconds: 30
  artifactMaxSizeMb: 100

secret:
  # Local development defaults only. In a real cluster use an external secret
  # manager or sealed secrets. Never commit real values.
  jwtSecret: change-me-locally
  databasePassword: shipment
  minioAccessKey: minioadmin
  minioSecretKey: minioadmin
  llmApiKey: ""

postgres:
  enabled: true
  image: postgres:16-alpine
  port: 5432
  database: shipment
  user: shipment
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

minio:
  enabled: true
  image: bitnamilegacy/minio:latest
  port: 9000
  consolePort: 9001
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: shipforge.local
  annotations: {}

monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.2.1
    port: 9090
    retention: 6h
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    image: grafana/grafana:12.0.0
    port: 3000
    adminUser: admin
    adminPassword: shipforge
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Worker metrics exposition port (Prometheus scrape target).
metrics:
  workerPort: 9100

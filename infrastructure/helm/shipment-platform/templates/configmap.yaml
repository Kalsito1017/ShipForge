apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shipment-platform.configMapName" . }}
  labels:
    {{- include "shipment-platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_EXPIRES_MINUTES: {{ .Values.config.jwtExpiresMinutes | quote }}
  LLM_BASE_URL: {{ .Values.config.llmBaseUrl | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_TIMEOUT_SECONDS: {{ .Values.config.llmTimeoutSeconds | quote }}
  ARTIFACT_MAX_SIZE_MB: {{ .Values.config.artifactMaxSizeMb | quote }}

# Local development secrets. In a real environment use an external secret
# manager (Vault, cloud KMS) or sealed-secrets — never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shipment-platform.secretName" . }}
  labels:
    {{- include "shipment-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.databasePassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secret.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secret.minioSecretKey | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  LLM_API_KEY: {{ .Values.secret.llmApiKey | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shipment-platform.worker.fullname" . }}
  labels:
    {{- include "shipment-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "shipment-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "shipment-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      # Celery warm shutdown: SIGTERM stops new task delivery and finishes
      # in-flight tasks before exit.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          securityContext:
            {{- toYaml .Values.worker.containerSecurityContext | nindent 12 }}
          # Image has no ENTRYPOINT — set the full command explicitly.
          command:
            - celery
            - -A
            - worker_app.main.celery_app
            - worker
            - --loglevel=INFO
            - --concurrency={{ .Values.worker.concurrency }}
          env:
            {{- include "shipment-platform.env" . | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - worker_app.main.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - worker_app.main.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

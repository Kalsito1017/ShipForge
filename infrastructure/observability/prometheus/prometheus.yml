global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: shipforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: shipforge-api

  - job_name: shipforge-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: shipforge-worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

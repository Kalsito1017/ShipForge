[project]
name = "shipforge-worker"
version = "0.1.0"
description = "ShipForge shipment pipeline worker"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worker_app", "worker_app.core", "worker_app.tasks", "worker_app.services"]
